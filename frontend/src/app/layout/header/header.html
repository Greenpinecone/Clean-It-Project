<nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" routerLink="/" (click)="closeMobileMenu()">
      Clean It! AG
    </a>

    <button
      class="navbar-toggler"
      type="button"
      aria-controls="mainNavigation"
      [attr.aria-expanded]="!isMenuCollapsed()"
      aria-label="Toggle navigation"
      (click)="toggleMobileMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="mainNavigation" class="collapse navbar-collapse" [ngbCollapse]="isMenuCollapsed()">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        @for (item of mainNavItems; track item.route) {
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.route === '/' }"
              (click)="closeMobileMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
