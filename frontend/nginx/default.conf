server {
    # catch all requests
    listen 80 default_server;
    # palceholder
    server_name _;
    
    # compiled frontend files are copied here
    # defines base path for requested routes
    root /usr/share/nginx/html;
    # default for directory requests
    index index.html;

    # configuration of HTTP virtual server 1
    location /api/v1/ {
        proxy_pass http://backend:8080;

        # standard headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # what client IP did nginx see
        proxy_set_header X-Real-IP $remote_addr;
        # What is the proxy/client IP chain
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # was the original request HTTP or HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file lookup startegy, falling back to angular SPA routing via index.html
     location / {
        try_files $uri $uri/ /index.html;
    }
}