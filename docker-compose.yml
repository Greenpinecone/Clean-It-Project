name: clean-it

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clean-it-backend:local
    ports:
      - "127.0.0.1:8081:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: clean-it-frontend:local
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend