name: Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-clean-it-dev
  AZURE_ACR_NAME: cleanitdev

  AZURE_BACKEND_CONTAINER_APP: backend
  AZURE_FRONTEND_CONTAINER_APP: frontend

  BACKEND_IMAGE_NAME: clean-it-backend
  FRONTEND_IMAGE_NAME: clean-it-frontend

  ACR_LOGIN_SERVER: cleanitdev-dkgtf6ezcxghcnby.azurecr.io

  # Unique for CI-triggered deployments and manual workflow_dispatch runs.
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build and deploy backend and frontend
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        #logs the local Docker client on the GitHub runner into your ACR before azure/container-apps-deploy-action tries to run docker push
      - name: Log in to ACR
        run: az acr login --name "${AZURE_ACR_NAME}"

      - name: Build and deploy backend Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          containerAppName: ${{ env.AZURE_BACKEND_CONTAINER_APP }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          ingress: external # For showcasing
          targetPort: 8080

      - name: Build and deploy frontend Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/frontend
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          containerAppName: ${{ env.AZURE_FRONTEND_CONTAINER_APP }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          ingress: external
          targetPort: 80
